<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIMXVOICE</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body>
<header class="header"><div class="brand" dir="ltr"><img src="icons/48.png" width="34" height="34" alt=""><strong>PIMX<span>VOICE</span></strong></div><div class="header-actions"><button id="locale" class="quiet-button" type="button" aria-label="Switch language">EN</button><button id="theme" class="icon-button" type="button" data-aria="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></button></div></header>
<nav id="navigation" class="tabs" hidden data-aria="navigation"><button id="translate-tab" class="tab active" type="button" data-view="translator" data-i18n="translateTab" aria-pressed="true"></button><button id="appearance-tab" class="tab" type="button" data-view="appearance" data-i18n="appearanceTab" aria-pressed="false"></button><button id="keys-tab" class="tab" type="button" data-view="keys" data-i18n="keysTab" aria-pressed="false"></button></nav>
<main>
<section id="onboarding" hidden><div class="intro"><h1 data-i18n="welcome"></h1><p class="muted" data-i18n="intro"></p></div><div class="guide"><h2 data-i18n="getKey"></h2><ol><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li></ol><a class="studio-link" href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" data-i18n="openStudio"></a></div><div id="onboarding-key-slot"></div><p class="field-help onboarding-model-hint" data-i18n="modelsAfterKey"></p></section>
<section id="translator" hidden>
 <div class="page-heading"><div><h1 data-i18n="translateHeading"></h1><p id="tab-title" class="muted"></p></div><span class="status-pill"><i id="status-dot"></i><span id="status-label"></span></span></div>
 <div class="session-scroll">
 <fieldset id="session-config"><legend class="sr-only" data-i18n="translationOptions"></legend>
  <div class="mode-picker" role="group" data-aria="outputMode"><button type="button" data-mode="dub" data-i18n="dubOnly" aria-pressed="false"></button><button type="button" data-mode="subtitles" data-i18n="subOnly" aria-pressed="false"></button><button type="button" data-mode="both" data-i18n="both" aria-pressed="true"></button></div>
  <div class="language-grid"><div><label for="source" data-i18n="source"></label><select id="source"></select></div><div id="dubbing-language"><label for="target" data-i18n="dubLanguage"></label><select id="target"></select></div></div>
  <div id="voice-controls" class="voice-field"><label for="voice-name" data-i18n="narrator"></label><select id="voice-name" dir="ltr"></select></div>
  <div class="live-model-field"><div class="model-label"><label for="model" data-i18n="liveModel"></label><button id="refresh-models" type="button" class="text-button" data-i18n="refresh"></button></div><select id="model" dir="ltr"></select><p id="model-status" class="field-help" role="status" aria-live="polite"></p></div>
  <details class="model-details"><summary><span data-i18n="advancedModels"></span><svg class="disclosure" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><p id="model-help" class="field-help"></p><label for="text-model" data-i18n="textModel"></label><select id="text-model" dir="ltr"></select><label for="voice-model" data-i18n="voiceModel"></label><select id="voice-model" dir="ltr"></select><p class="field-help" data-i18n="modelCosts"></p></details>
 </fieldset>
 <div id="subtitle-summary-row" class="subtitle-summary"><span id="subtitle-summary"></span><button id="edit-subtitles" type="button" class="text-button" data-i18n="customize"></button></div>
 <div id="main-preview" class="caption-preview"><div class="preview-heading"><span data-i18n="subtitles"></span><span id="preview-kind"></span></div><div class="preview-text"><p id="preview-translation" dir="auto"></p><p id="preview-secondary" dir="auto"></p></div></div>
 </div>
 <div class="action-area"><button id="start-stop" type="button" class="primary full"><svg id="action-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg><span id="action-label"></span></button><p id="session-hint" class="privacy"></p><div class="bottom-links"><button id="export" type="button" class="text-button" data-i18n="export" disabled></button><span id="active-key" class="muted"></span></div></div>
</section>
<section id="appearance" hidden>
 <div class="page-heading"><div><h1 data-i18n="appearanceHeading"></h1><p class="muted" data-i18n="appearanceHelp"></p></div></div>
 <div class="caption-preview appearance-preview"><div class="preview-heading"><span data-i18n="sampleAppearance"></span><button id="reset-style" class="text-button" type="button" data-i18n="resetStyle"></button></div><div class="preview-text"><p id="style-primary" dir="auto"></p><p id="style-secondary" dir="auto"></p></div></div>
 <fieldset id="subtitle-config"><legend class="sr-only" data-i18n="subtitleLanguages"></legend><label for="subtitle-language" data-i18n="subtitleLanguage"></label><select id="subtitle-language"></select><label class="toggle-row" for="dual-subtitles"><span><strong data-i18n="dualSubtitles"></strong><small data-i18n="dualHelp"></small></span><input class="switch" id="dual-subtitles" type="checkbox"></label><div id="second-language-field"><label for="subtitle-language-2" data-i18n="subtitleLanguage2"></label><select id="subtitle-language-2"></select></div></fieldset>
 <div class="setting-row"><label for="font-family" data-i18n="font"></label><div class="font-row"><select id="font-family"></select><label for="font-file" class="upload-button" tabindex="0" role="button" data-i18n="uploadFont"></label><input id="font-file" type="file" accept=".woff2,.woff,.ttf,.otf" class="sr-only"></div><div class="font-meta"><span id="font-name" class="field-help"></span><button id="remove-font" class="text-button danger-text" type="button" data-i18n="removeFont" hidden></button></div><p class="field-help" data-i18n="fontHelp"></p></div>
 <div class="style-grid"><div><label for="font-size" data-i18n="fontSize"></label><input id="font-size" type="number" min="12" max="72" step="1"></div><div><label for="second-font-size" data-i18n="secondFontSize"></label><input id="second-font-size" type="number" min="12" max="72" step="1"></div><div><label for="text-color" data-i18n="textColor"></label><input id="text-color" type="color"></div><div><label for="second-color" data-i18n="secondColor"></label><input id="second-color" type="color"></div></div>
 <details class="advanced"><summary data-i18n="moreStyles"></summary><div class="style-grid"><div><label for="background-color" data-i18n="backgroundColor"></label><input id="background-color" type="color"></div><div><label for="background-opacity" data-i18n="backgroundOpacity"></label><input id="background-opacity" type="number" min="0" max="100"></div><div><label for="outline-color" data-i18n="outlineColor"></label><input id="outline-color" type="color"></div><div><label for="outline-width" data-i18n="outlineWidth"></label><input id="outline-width" type="number" min="0" max="4" step="0.5"></div><div><label for="position" data-i18n="position"></label><select id="position"><option value="bottom" data-i18n="bottom"></option><option value="top" data-i18n="top"></option></select></div><div><label for="offset" data-i18n="offset"></label><input id="offset" type="number" min="0" max="40"></div><div><label for="alignment" data-i18n="alignment"></label><select id="alignment"><option value="center" data-i18n="center"></option><option value="left" data-i18n="left"></option><option value="right" data-i18n="right"></option></select></div><div><label for="font-weight" data-i18n="fontWeight"></label><select id="font-weight"><option value="400" data-i18n="regular"></option><option value="600" data-i18n="medium"></option><option value="800" data-i18n="bold"></option></select></div><div><label for="line-height" data-i18n="lineHeight"></label><input id="line-height" type="number" min="1.2" max="2.4" step="0.1"></div><div><label for="radius" data-i18n="radius"></label><input id="radius" type="number" min="0" max="24"></div><div><label for="padding" data-i18n="padding"></label><input id="padding" type="number" min="2" max="30"></div></div><label class="toggle-row" for="shadow"><span data-i18n="shadow"></span><input id="shadow" class="switch" type="checkbox"></label></details>
</section>
<section id="keys" hidden><div class="page-heading"><div><h1 data-i18n="keysHeading"></h1><p class="muted" data-i18n="keysHelp"></p></div></div><div id="key-list"></div><p class="field-help" data-i18n="quotaHelp"></p><details id="add-key-details" class="advanced" open><summary data-i18n="addKey"></summary><div id="extra-key-slot"></div></details><button id="forget-key" class="text-button danger-text" type="button" data-i18n="forget"></button><details class="help"><summary data-i18n="help"></summary><p data-i18n="limitations"></p><a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" data-i18n="openStudio"></a><a href="https://aistudio.google.com/rate-limit" target="_blank" rel="noreferrer" data-i18n="quotaLink"></a></details></section>
<div id="notice" role="status" aria-live="polite" hidden></div>
</main>
<form id="key-form" hidden><label for="key-name" data-i18n="keyName"></label><input id="key-name" type="text" maxlength="40" autocomplete="off"><label for="api-key" data-i18n="apiKey"></label><div class="key-input"><input id="api-key" type="password" dir="ltr" autocomplete="off" spellcheck="false" placeholder="Gemini API key" required><button id="reveal-key" type="button" class="icon-button" data-aria="showKey" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><label class="remember"><input id="remember" type="checkbox"><span data-i18n="remember"></span></label><button id="connect" type="submit" class="primary full"><span data-i18n="connect"></span></button><p class="privacy" data-i18n="keyPrivacy"></p></form>
<footer><span data-i18n="footer"></span><span dir="ltr">PIMXVOICE 2.2</span></footer>
</body></html>
